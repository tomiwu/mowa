strict: true
included: [App, Keyboard, Packages, Tools]
excluded: [.build, "**/.build"]
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - fatal_error_message
  - first_where
  - empty_count
  - sorted_imports
  - unused_parameter
  - private_swiftui_state
  - prefer_self_in_static_references
disabled_rules: [trailing_comma, opening_brace]
force_cast: error
force_try: error
cyclomatic_complexity: { warning: 3, error: 4 }
function_body_length: { warning: 30, error: 50 }
file_length: { warning: 300, error: 500 }
custom_rules:
  no_singleton:
    regex: 'static\s+(let|var)\s+shared\b'
    message: "Do not use singletons. Inject the dependency."
    severity: error
  no_combine:
    regex: '^import Combine'
    message: "Use async/await or AsyncStream, not Combine."
    severity: error
