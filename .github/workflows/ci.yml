name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  SIMULATOR_NAME: iPhone 17
  SIMULATOR_OS: "26.5"
  SWIFTLINT_VERSION: 0.65.1
  LIZARD_VERSION: 1.24.1

jobs:
  format:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive --parallel App Keyboard Packages Tools

  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Check SwiftLint version
        run: test "$(swiftlint --version)" = "$SWIFTLINT_VERSION"
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: build-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved', 'mowa.xcodeproj/project.pbxproj') }}
          restore-keys: build-${{ runner.os }}-
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Build app and keyboard
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project mowa.xcodeproj \
            -scheme mowa \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$SIMULATOR_OS" \
            | xcbeautify --renderer github-actions

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Cache DerivedData and SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            Packages/*/.build
            Tools/*/.build
          key: test-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: test-${{ runner.os }}-
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Test logic packages with swift test
        run: |
          for package in Packages/* Tools/*; do
            swift test --package-path "$package" --enable-code-coverage -Xswiftc -warnings-as-errors
          done
      - name: Test packages on the simulator
        run: |
          set -o pipefail
          mkdir -p build
          for package in Packages/*; do
            name="$(basename "$package")"
            (cd "$package" && xcodebuild test \
              -scheme "$name" \
              -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$SIMULATOR_OS" \
              -enableCodeCoverage YES \
              -resultBundlePath "$GITHUB_WORKSPACE/build/$name.xcresult") | xcbeautify --renderer github-actions
          done
      - name: Test CrapGate on macOS
        run: |
          set -o pipefail
          (cd Tools/CrapGate && xcodebuild test \
            -scheme CrapGate \
            -destination "platform=macOS" \
            -enableCodeCoverage YES \
            -resultBundlePath "$GITHUB_WORKSPACE/build/CrapGate.xcresult") | xcbeautify --renderer github-actions
      - name: Test WerScript on macOS
        run: |
          set -o pipefail
          (cd Tools/WerScript && xcodebuild test \
            -scheme WerScript \
            -destination "platform=macOS" \
            -enableCodeCoverage YES \
            -resultBundlePath "$GITHUB_WORKSPACE/build/WerScript.xcresult") | xcbeautify --renderer github-actions
      - name: Test scripts/check_secrets.sh
        run: scripts/tests/check_secrets_test.sh
      - name: Upload result bundles
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/*.xcresult
          if-no-files-found: error

  crap:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Install lizard ${{ env.LIZARD_VERSION }}
        run: python3 -m pip install --break-system-packages "lizard==$LIZARD_VERSION"
      - name: Download result bundles
        uses: actions/download-artifact@v4
        with:
          name: xcresult
          path: build
      - name: Test scripts/crap.sh
        run: scripts/tests/crap_test.sh
      - name: CRAP gate
        run: scripts/crap.sh build/*.xcresult

  testflight:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [format, lint, build, test, crap]
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        run: scripts/check_secrets.sh
      - name: Select Xcode 26.6
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build and upload to TestFlight
        run: bundle exec fastlane beta
